<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrainerAssess</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#182d3b;font:15px system-ui}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:11px 17px;background:#087e8b;color:white;font-weight:600}button.secondary{background:#edf3f6;color:#294353}aside{width:238px;position:fixed;height:100vh;background:#122e3e;color:#d6e2e9;padding:30px 20px}.brand{font-size:23px;font-weight:750;color:white}.brand span{color:#58d3c1}small{color:#6c808e}aside small{color:#a1b9c8}nav{margin-top:38px}nav button{display:block;text-align:left;width:100%;background:none;margin:7px 0;color:#b7ccd8}nav button.active{background:#244859;color:white}main{margin-left:238px;padding:30px 42px;max-width:1600px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dce5eb;padding-bottom:22px}.badge{background:#fff1cc;color:#856011;border-radius:20px;padding:6px 10px;font-size:12px}.top{display:flex;justify-content:space-between;align-items:center;margin:30px 0 22px}h1{font-size:30px;margin:0 0 7px}h2{font-size:19px}p{line-height:1.6}.stats,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:white;border:1px solid #e0e8ee;border-radius:13px;padding:24px;margin-bottom:20px}.number{font-size:32px;font-weight:700;margin-top:9px}.eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#63808f;font-weight:700}.pill{background:#e5f5ef;color:#18765d;border-radius:20px;padding:5px 9px;font-size:12px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.class-icon{background:#e2f2f3;color:#087e8b;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:23px}label{display:block;margin:15px 0 6px;font-size:13px;font-weight:600}input,select,textarea{width:100%;border:1px solid #cad9e1;border-radius:7px;padding:10px;background:white;color:#182d3b}textarea{min-height:110px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:15px 10px;border-bottom:1px solid #edf1f4}th{font-size:12px;color:#6c808e}td input{max-width:90px}.notice{background:#e9f3f6;border-left:3px solid #087e8b;padding:13px 17px;border-radius:5px;font-size:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.muted{color:#718793;font-size:13px}.empty{padding:30px;text-align:center;color:#718793}dialog{border:0;border-radius:14px;width:min(530px,95vw);padding:28px}dialog::backdrop{background:#0c273b88}.foot{position:absolute;bottom:25px;font-size:12px}#toast{position:fixed;bottom:25px;right:25px;background:#133d43;color:white;padding:15px;border-radius:9px;display:none}.actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}@media(max-width:850px){aside{position:relative;width:100%;height:auto;padding:18px}nav{margin:15px 0 0;display:flex;flex-wrap:wrap}nav button{width:auto}.foot{display:none}main{margin:0;padding:22px}.grid,.stats,.two{grid-template-columns:1fr}.row{flex-wrap:wrap}header{gap:12px}}
</style><aside><div class="brand">Trainer<span>Assess</span></div><small>School assessment workspace</small><nav id="nav"></nav><div class="foot">TVET • Teach. Assess. Improve.<br><br>School assessment workspace</div></aside><main><header><div><b>Assessment workspace</b><br><small>One place for every learning outcome</small></div><span class="badge">Signed in • shared school workspace</span><span id="account"></span><button class="secondary" onclick="fetch('/logout',{method:'POST'}).then(()=>location.href='/login')">Sign out</button></header><div id="syncError" class="notice" role="alert" hidden></div><div id="app"></div></main><dialog id="modal"></dialog><div id="toast" role="status"></div><script>
(async()=>{
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial={classes:[{id:'c1',owner:'t1',name:'Electrical Technology L4',module:'Electrical machines',lo:'LO1: Perform pre-assembly activities',students:['Aline Uwase','Eric Mugisha','Diane Ingabire','Patrick Niyonzima']},{id:'c2',owner:'t1',name:'Electrical Technology L3',module:'Fundamentals of electricity',lo:'LO1: Interpret electrical quantities',students:['Alice Keza','Jean Habimana']},{id:'c3',owner:'t2',name:'Computer Systems L5',module:'Embedded system hardware',lo:'LO1: Prepare the design environment',students:['Grace Mukamana','David Ishimwe']}],questions:[{id:'q1',classId:'c1',text:'Explain why a motor must be isolated before inspection. Give two checks before work starts.',answer:'Isolate and lock out the supply; verify absence of voltage with an appropriate tester. Follow the approved procedure.',max:5},{id:'q2',classId:'c1',text:'Identify two suitable tools for checking motor shaft alignment and explain their purpose.',answer:'Dial indicator or laser alignment tool; measure shaft offset and angular misalignment.',max:5}],records:[],released:{}};
const identity=await fetch('/api/account').then(r=>r.json());if(!identity.userId){location.href='/login';return}
$('#account').textContent=identity.displayName+' · '+identity.role;
let db,revision=0,blocked=false,queue=Promise.resolve();let owner='t1',page='Overview',selected;
function save(){if(blocked)return toast('Saving stopped. Reload to get the latest data.');let snapshot=structuredClone(db);queue=queue.then(async()=>{if(blocked)return;let r=await fetch('/api/workspace',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:snapshot,revision})});if(!r.ok)throw Error(await r.text());revision=(await r.json()).revision}).catch(e=>{blocked=true;$('#syncError').textContent='Changes not saved: '+e.message+' Reload before continuing.';$('#syncError').hidden=false})}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2800)}function classes(){return db.classes.filter(c=>c.owner===owner)}function cls(){return classes().find(c=>c.id===selected)||classes()[0]}function qs(){return db.questions.filter(q=>q.classId===cls()?.id)}function rec(s,q){return db.records.find(r=>r.classId===cls().id&&r.student===s&&r.qid===q)}
if(identity.role==='student'){await studentView();return}
let loaded=await fetch('/api/workspace');if(!loaded.ok){$('#app').textContent='Unable to load workspace. Please reload.';return}let data=await loaded.json();db=data.data;revision=data.revision;selected=db.classes[0]?.id;
function picker(){return `<select aria-label="Select class" onchange="selected=this.value;render()" style="max-width:350px">${classes().map(c=>`<option value="${c.id}" ${c.id===cls()?.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`}function head(title,sub,action=''){return `<div class="top"><div><h1>${title}</h1><small>${sub}</small></div>${action}</div>`}
function render(){let items=['Overview','My classes','Question bank','Written assessment','Oral assessment','Markbook'];$('#nav').innerHTML=items.map((n,i)=>`<button class="${page===n?'active':''}" onclick="page='${n}';render()">${['◈','▦','≡','✎','◉','▤'][i]} &nbsp; ${n}</button>`).join('');let c=cls();let html='';if(page==='Overview'){html=head('Make every answer count.','Manage your classes, assess understanding, and give useful feedback.',`<button onclick="page='Oral assessment';render()">Start oral assessment →</button>`)+`<div class="stats">${[['My classes',classes().length],['Students',classes().reduce((a,c)=>a+c.students.length,0)],['Questions',db.questions.filter(q=>classes().some(c=>c.id===q.classId)).length]].map(([a,b])=>`<div class="card"><div class="eyebrow">${a}</div><div class="number">${b}</div></div>`).join('')}</div><div class="row"><h2>Your teaching spaces</h2><button class="secondary" onclick="newClass()">+ Add class</button></div>`+classCards()+`<div class="notice"><b>Test the complete workflow.</b> Add a question, use the student preview to submit a written answer, receive automatic marks for objective questions, then review in the markbook. Records are saved to your signed-in account. Link student emails in My classes to enable their access.</div>`}else if(page==='My classes'){html=head('My classes','Your teaching spaces and student rosters.',`<button onclick="newClass()">+ Add class</button>`)+classCards()+ (c?`<div class="card"><div class="row"><h2>Student roster</h2>${picker()}</div>${c.students.map((s,i)=>`<p>${String(i+1).padStart(2,'0')} &nbsp; ${esc(s)}</p>`).join('')}<button class="secondary" onclick="addStudent()">+ Add student</button> <button class="secondary" onclick="enroll()">Link student email</button><p class="muted">${(c.enrollments||[]).map(x=>esc(x.name)+' · '+esc(x.email)).join('<br>')}</p></div>`:'')}else if(page==='Question bank'){html=head('Question bank','Build questions with clear marking criteria.',`<button onclick="newQuestion()">+ Add question</button>`)+picker()+`<div style="margin-top:20px">${qs().map((q,i)=>`<div class="card"><div class="row"><span class="eyebrow">Question ${i+1}</span><span class="pill">${q.max} marks</span></div><h2>${esc(q.text)}</h2><p class="muted">${typeLabel(q)} · ${q.type&&q.type!=='manual'?'Automatic marking':'Trainer marking'}</p><details><summary>Expected answer / marking guide</summary><p>${esc(q.answer)}</p></details><p class="muted">${esc(c.lo)}</p></div>`).join('')||'<div class="empty">Add your first question.</div>'}</div>`}else if(page==='Written assessment'){html=head('Written assessment','Student preview · objective answers are marked on submission.')+picker()+`<div class="notice" style="margin-top:18px">Trainer preview only. Students use their own signed-in accounts and are marked securely on the server.</div>`+(c?`<div class="card" style="margin-top:20px"><label>Student</label><select id="student">${c.students.map(s=>`<option>${esc(s)}</option>`).join('')}</select><form id="written">${qs().map((q,i)=>`<label>${i+1}. ${esc(q.text)} (${q.max} marks)</label>${answerInput(q)}`).join('')}<div class="actions"><button ${!qs().length||!c.students.length?'disabled':''}>Submit answers →</button></div></form></div>`:'')}else if(page==='Oral assessment'){html=head('Oral assessment','Ask aloud. Record evidence. Award marks.')+picker()+(c?`<div class="two" style="margin-top:20px"><div class="card"><span class="eyebrow">Live classroom assessment</span><label>Student</label><select id="oralStudent">${c.students.map(s=>`<option>${esc(s)}</option>`).join('')}</select><label>Question</label><select id="oralQ" onchange="showGuide()">${qs().map(q=>`<option value="${q.id}">${esc(q.text)}</option>`).join('')}</select><p id="guide" class="notice"></p></div><form id="oral" class="card"><h2>Record the response</h2><label>Answer notes / observed evidence</label><textarea id="oralNotes" required placeholder="Record what the student explained…"></textarea><label>Marks awarded</label><input id="oralScore" type="number" min="0" step="0.5" required><label>Feedback</label><textarea id="oralFeedback" placeholder="What was correct? What should improve?"></textarea><div class="actions"><button ${!qs().length||!c.students.length?'disabled':''}>Save oral mark</button></div></form></div>`:'')}else{html=head('Markbook','Review evidence and release results only when ready.',`<button class="secondary" onclick="exportCSV()">↓ Export CSV</button>`)+picker()+(c?`<div class="card" style="margin-top:20px"><div class="row"><h2>${esc(c.module)}</h2><span class="pill">${db.released[c.id]?'Results released':'Results withheld'}</span></div><div style="overflow:auto"><table><thead><tr><th>STUDENT</th>${qs().map((q,i)=>`<th>Q${i+1} / ${q.max}</th>`).join('')}<th>RESULT</th></tr></thead><tbody>${c.students.map(s=>{let rr=qs().map(q=>rec(s,q.id)),complete=rr.length>0&&rr.every(r=>r?.score!==null&&r?.score!==undefined);return `<tr><td><b>${esc(s)}</b></td>${qs().map(q=>{let r=rec(s,q.id);return `<td><button class="secondary" onclick="mark('${q.id}',${JSON.stringify(s).replace(/"/g,'&quot;')})">${r?.score??(r?'Review':'Not assessed')}</button></td>`}).join('')}<td>${complete?rr.reduce((a,r)=>a+r.score,0)+' / '+qs().reduce((a,q)=>a+q.max,0):'Pending'}</td></tr>`}).join('')}</tbody></table></div><div class="actions"><button onclick="release()">${db.released[c.id]?'Withhold results':'Release results'}</button></div></div>`:'')}$('#app').innerHTML=html;if(page==='Written assessment'&&$('#written'))$('#written').onsubmit=e=>{e.preventDefault();let s=$('#student').value;for(let q of qs()){let r=rec(s,q.id);if(r){toast('An answer already exists. Ask your trainer before resubmitting.');return}}for(let q of qs())db.records.push({classId:c.id,student:s,qid:q.id,answer:new FormData(e.target).get(q.id),mode:'Written',...gradeAnswer(q,new FormData(e.target).get(q.id))});db.released[c.id]=false;save();renderReceipt(s);e.target.reset()};if(page==='Oral assessment'&&$('#oral')){showGuide();$('#oral').onsubmit=e=>{e.preventDefault();let q=qs().find(q=>q.id===$('#oralQ').value),score=Number($('#oralScore').value);if(score<0||score>q.max)return toast('Enter a score between 0 and '+q.max);let s=$('#oralStudent').value,r=rec(s,q.id);if(r&&!confirm('Replace the existing response and mark for this question?'))return;let value={classId:c.id,student:s,qid:q.id,answer:$('#oralNotes').value,mode:'Oral',score,feedback:$('#oralFeedback').value};if(r)Object.assign(r,value);else db.records.push(value);db.released[c.id]=false;save();toast('Oral response and mark saved');e.target.reset();showGuide()}}}

function enroll(){if(!cls()?.students.length)return toast('Add students first');modal('Link student sign-in email', '<label>Student</label><select name="name">'+cls().students.map(n=>'<option>'+esc(n)+'</option>').join('')+'</select>'+field('email','Student account email','email'),f=>{let email=f.get('email').trim().toLowerCase(),name=f.get('name');let en=cls().enrollments||[];if(en.some(x=>x.email===email&&x.name!==name)){toast('That email is already linked to another student');return false}cls().enrollments=en.filter(x=>x.name!==name).concat({email,name})})}
async function studentView(){let r=await fetch('/api/student');if(!r.ok)throw Error();let courses=await r.json();$('#nav').innerHTML='<p>My assessments</p>';$('#app').innerHTML=head('My assessments','Answer your assigned questions and receive automatic marks.')+(courses.length?'':'<div class="card">No classes assigned yet. Ask your trainer to link your sign-in email to your student name.</div>');for(let c of courses){let box=document.createElement('div');box.className='card';box.innerHTML='<h2>'+esc(c.name)+'</h2><p>'+esc(c.module)+'</p>';if(c.records.length){box.innerHTML+='<p>Submitted · '+(c.released?'Results released':'Trainer review / final results withheld')+'</p>'+c.records.map(r=>'<p>'+esc(c.questions.find(q=>q.id===r.qid)?.text)+'<br><b>'+(c.released?esc(r.score??'Pending review'):'Awaiting release')+'</b> '+esc(r.feedback||'')+'</p>').join('')}else{let form=document.createElement('form');form.innerHTML=c.questions.map((q,i)=>'<label>'+(i+1)+'. '+esc(q.text)+' ('+q.max+' marks)</label>'+answerInput(q)).join('')+'<div class="actions"><button '+(!c.questions.length?'disabled':'')+'>Submit answers</button></div>';form.onsubmit=async e=>{e.preventDefault();let btn=form.querySelector('button');btn.disabled=true;try{let res=await fetch('/api/student',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({owner:c.owner,classId:c.id,answers:Object.fromEntries(new FormData(form))})});if(!res.ok)throw Error(await res.text());let data=await res.json();form.innerHTML='<h2>Submission received</h2>'+data.scores.map((v,i)=>'<p>Q'+(i+1)+': <b>'+(v.score==null?'Pending trainer review':v.score+' / '+v.max)+'</b></p>').join('')+'<p>Automatic marks are provisional. Your trainer will release final results.</p>'}catch(err){toast(err.message);btn.disabled=false}};box.append(form)}$('#app').append(box)}}

Object.assign(window, { $, render, newClass, addStudent, newQuestion, questionFields, showGuide, mark, release, exportCSV, enroll });
Object.defineProperty(window, 'page', { configurable: true, get: () => page, set: value => { page = value; } });
Object.defineProperty(window, 'selected', { configurable: true, get: () => selected, set: value => { selected = value; } });function classCards(){return `<div class="grid">${classes().map(c=>`<div class="card"><div class="row"><div class="class-icon">▦</div><span class="pill">${c.students.length} students</span></div><h2>${esc(c.name)}</h2><p class="muted">${esc(c.module)}</p><p class="muted">${esc(c.lo)}</p><button class="secondary" onclick="selected='${c.id}';page='Question bank';render()">Open class →</button></div>`).join('')}</div>`}function modal(t,fields,cb){$('#modal').innerHTML=`<h2>${t}</h2><form id="dialogForm">${fields}<div class="actions"><button type="button" class="secondary" onclick="$('#modal').close()">Cancel</button><button>Save</button></div></form>`;$('#dialogForm').onsubmit=e=>{e.preventDefault();if(cb(new FormData(e.target))===false)return;save();$('#modal').close();render();toast('Saved successfully')};$('#modal').showModal()}function field(n,t,type='text'){return `<label>${t}</label><input name="${n}" type="${type}" required>`}function newClass(){modal('Create a class',field('name','Class name')+field('module','Module')+field('lo','Learning outcome'),f=>{let c={id:crypto.randomUUID(),owner,name:f.get('name').trim(),module:f.get('module').trim(),lo:f.get('lo').trim(),students:[]};if(!c.name||!c.module||!c.lo)return false;db.classes.push(c);selected=c.id})}function addStudent(){modal('Add student',field('name','Full name'),f=>{let n=f.get('name').trim();if(!n||cls().students.includes(n)){toast('Use a unique student name');return false}cls().students.push(n)})}function newQuestion(){if(!cls())return toast('Create a class first');modal('Add question',`<p class="muted">${esc(cls().name)}</p><label>Question</label><textarea name="text" required></textarea><label>Question type</label><select name="type" id="qType" onchange="questionFields()"><option value="mcq">Multiple choice — automatic</option><option value="tf">True / false — automatic</option><option value="short">Short answer — automatic exact match</option><option value="manual">Written response — trainer review</option></select><div id="typeFields"></div><label>Maximum marks</label><input name="max" type="number" min="0.5" step="0.5" required value="5">`,f=>{let type=f.get('type'),q={id:crypto.randomUUID(),classId:cls().id,text:f.get('text').trim(),type,max:Number(f.get('max'))};if(!q.text||!Number.isFinite(q.max)||q.max<=0)return false;if(type==='mcq'){q.options=['a','b','c','d'].map(k=>f.get(k).trim());if(q.options.some(v=>!v)||new Set(q.options.map(normalize)).size!==4){toast('Enter four different options');return false}q.correct=f.get('correct');q.answer=q.options[Number(q.correct)]}else if(type==='tf'){q.correct=f.get('correct');q.answer=q.correct}else if(type==='short'){q.accepted=f.get('accepted').split('\n').map(v=>v.trim()).filter(Boolean);if(!q.accepted.length)return false;q.answer=q.accepted.join(' / ')}else q.answer=f.get('answer').trim();db.questions.push(q);db.released[cls().id]=false});questionFields()}
function questionFields(){let t=$('#qType').value;$('#typeFields').innerHTML=t==='mcq'?['a','b','c','d'].map((k,i)=>field(k,'Option '+String.fromCharCode(65+i))).join('')+'<label>Correct option</label><select name="correct"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select>':t==='tf'?'<label>Correct answer</label><select name="correct"><option>True</option><option>False</option></select>':t==='short'?'<label>Accepted answers — one complete answer per line</label><textarea name="accepted" required placeholder="ampere\nampères"></textarea><p class="muted">Matches a complete accepted answer, ignoring case and extra spaces. Add valid alternatives. No keyword or meaning-based scoring.</p>':'<label>Expected answer / marking criteria</label><textarea name="answer" required></textarea>'}
function normalize(v){return String(v??'').normalize('NFKC').trim().replace(/\s+/g,' ').toLowerCase()}
function typeLabel(q){return ({mcq:'Multiple choice',tf:'True / false',short:'Short answer',manual:'Written response'})[q.type]||'Written response'}
function answerInput(q){if(q.type==='mcq'||q.type==='tf'){let opts=q.type==='mcq'?q.options:['True','False'];return `<select required name="${q.id}"><option value="">Choose an answer…</option>${opts.map((v,i)=>`<option value="${q.type==='mcq'?i:v}">${esc(v)}</option>`).join('')}</select>`}return `<textarea required name="${q.id}" placeholder="Write your answer here…"></textarea>`}
function gradeAnswer(q,value){let type=q.type||'manual';if(type==='manual')return {score:null,feedback:'Awaiting trainer review.',marking:'Manual'};let valid=type==='mcq'?Array.isArray(q.options)&&q.options.length===4&&q.options[Number(q.correct)]!==undefined:type==='tf'?['True','False'].includes(q.correct):type==='short'&&q.accepted?.length;if(!valid)return {score:null,feedback:'Marking key missing. Trainer review required.',marking:'Manual'};let correct=type==='short'?q.accepted.some(a=>normalize(a)===normalize(value)):String(value)===String(q.correct);return {score:correct?q.max:0,feedback:correct?'Correct. Automatically marked.':type==='short'?'No accepted answer matched. Trainer can review alternative wording.':'Incorrect. Automatically marked.',marking:'Automatic'}}
function renderReceipt(student){let rr=qs().map(q=>rec(student,q.id)),marked=rr.filter(r=>r.score!=null),total=marked.reduce((a,r)=>a+r.score,0),max=qs().reduce((a,q)=>a+q.max,0);let box=document.createElement('div');box.className='card';box.id='receipt';$('#receipt')?.remove();box.innerHTML=`<h2>Submission received</h2><p><b>${esc(student)}</b> · ${marked.length===rr.length?'Total':'Marked so far'}: <b>${total} / ${max}</b>${marked.length===rr.length?'':' · '+(rr.length-marked.length)+' awaiting trainer review'}</p><p class="muted">Automatic marks can be reviewed by your trainer.</p>${qs().map((q,i)=>{let r=rec(student,q.id);return `<p>Q${i+1}: <b>${r.score??'Pending review'}${r.score!=null?' / '+q.max:''}</b> — ${esc(r.feedback)}</p>`}).join('')}`;$('#app').append(box);box.scrollIntoView({behavior:'smooth'});toast('Answers submitted and automatic marks saved')}
function showGuide(){let q=qs().find(q=>q.id===$('#oralQ')?.value);$('#guide').textContent=q?`Marking guide (${q.max} marks): ${q.answer}`:'Add a question in the question bank first.';if(q)$('#oralScore').max=q.max}function mark(id,s){let q=qs().find(q=>q.id===id),r=rec(s,id);if(!r)return toast('No response recorded. Use written or oral assessment first.');modal('Review response',`<p><b>${esc(s)}</b> · ${r.mode}</p><p>${esc(q.text)}</p><div class="notice">${esc(q.type==='mcq'&&r.mode==='Written'?(q.options?.[Number(r.answer)]??r.answer):r.answer)}</div><p class="muted">Guide: ${esc(q.answer)}</p><label>Score / ${q.max}</label><input name="score" type="number" min="0" max="${q.max}" step="0.5" required value="${r.score??''}"><label>Feedback</label><textarea name="feedback">${esc(r.feedback)}</textarea>`,f=>{r.score=Number(f.get('score'));r.feedback=f.get('feedback');db.released[cls().id]=false})}function release(){let c=cls();if(!db.released[c.id]&&(!qs().length||!c.students.length||c.students.some(s=>qs().some(q=>rec(s,q.id)?.score==null))))return toast('Assess and mark every student/question before releasing results.');db.released[c.id]=!db.released[c.id];save();render()}function exportCSV(){if(!cls())return;let rows=[['Student','Question','Mode','Answer','Marks','Maximum','Feedback','Release status']];for(let s of cls().students)for(let q of qs()){let r=rec(s,q.id);rows.push([s,q.text,r?.mode??'',r?.answer??'',r?.score??'Not assessed',q.max,r?.feedback??'',db.released[cls().id]?'Released':'Withheld'])}let blob=new Blob(['\ufeff'+rows.map(row=>row.map(v=>'"'+String(/^[=+@\-\t\r]/.test(String(v))?"'"+v:v).replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='assessment-marks.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();
if(identity.role==='admin'){let box=document.createElement('div');box.className='card';box.innerHTML='<h2>School accounts</h2><p>Grant a trainer access using the email they use to sign in. Create an account or issue a one-time password setup link. Share that link privately with the intended person.</p><form id="grant"><label>Email</label><input name="email" type="email" required><label>Role</label><select name="role"><option value="trainer">Trainer</option><option value="student">Student</option></select><div class="actions"><button>Save account role</button></div></form>';document.querySelector('main').append(box);$('#grant').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),r=await fetch('/api/account',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});if(!r.ok)return toast(await r.text());let result=await r.json();let link=document.createElement('div');link.className='notice';link.textContent='One-time account setup / password reset link (expires in 1 hour). Share privately: '+result.setupUrl;box.append(link)}}
})().catch(e=>{document.querySelector('#app').textContent='Unable to open workspace. Reload and try again.';console.error(e)});
